name: Feature Request
description: Suggest an idea, enhancement, or new feature for FluxCluster.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in improving FluxCluster!
        Please fill out this form to suggest a new feature or enhancement.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: e.g., I'm always frustrated when [Worker node drops connection...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Tell us how you think this should be implemented...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Related Component
      description: Which part of the architecture would this primarily affect?
      options:
        - Master Node (Orchestrator / Redis)
        - Viewer Node (Client / React)
        - Worker Node (Swarm / Rendering)
        - WebRTC / Signaling
        - Documentation / Other
    validations:
      required: true
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a PR for this feature.
